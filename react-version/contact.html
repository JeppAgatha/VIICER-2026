<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Contact &mdash; i-BIS</title>
    <meta name="description" content="Questions about i-BIS deployment, a demo request, or a partnership enquiry — get in touch with the team.">
    <meta property="og:title" content="Our Contact — i-BIS">
    <meta property="og:description" content="Talk to the team behind i-BIS about deployment, demos, or partnerships.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <section id="contact" class="about">
        <div class="about-content">
            <p class="about-eyebrow">Our contact</p>
            <h1 class="about-title">Talk to the team behind i-BIS</h1>
            <p class="about-lede">Questions about deployment, a demo request, or a partnership enquiry &mdash; send us a message and we'll get back to you.</p>

            <form class="about-card contact-form">
                <div class="form-field">
                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" name="name" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Send message</button>
            </form>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
